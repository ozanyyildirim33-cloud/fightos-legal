<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FightOS — Yasal Belgeler / Legal</title>
<style>
  :root {
    --ink: #1a1a1f;
    --muted: #6b7280;
    --line: #e5e7eb;
    --accent: #ff2e4c;
    --bg: #fafafa;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.65;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 40px 20px 80px; }
  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .brand { font-weight: 800; font-size: 20px; letter-spacing: 0.02em; }
  .brand span { color: var(--accent); }
  .lang-toggle { display: flex; gap: 6px; }
  .lang-btn {
    border: 1px solid var(--line);
    background: white;
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    color: var(--muted);
  }
  .lang-btn.active { background: var(--ink); color: white; border-color: var(--ink); }
  .updated { color: var(--muted); font-size: 13px; margin-bottom: 32px; }
  h1 { font-size: 28px; margin: 24px 0 4px; }
  h2 { font-size: 18px; margin: 32px 0 10px; }
  p, li { color: #374151; font-size: 15px; }
  ul { padding-left: 20px; }
  .notice {
    background: #fff7ed;
    border: 1px solid #fed7aa;
    border-radius: 12px;
    padding: 14px 16px;
    font-size: 13px;
    color: #9a3412;
    margin-bottom: 28px;
  }
  a { color: var(--accent); }
  hr { border: none; border-top: 1px solid var(--line); margin: 40px 0; }
  .lang-block { display: none; }
  .lang-block.visible { display: block; }
</style>
</head>
<body>
<div class="wrap">
  <header><div class="brand">Fight<span>OS</span></div></header>
  <h1>Yasal Belgeler <span style="opacity:.6">/ Legal</span></h1>
  <p>FightOS için gizlilik politikası ve kullanım şartları. / Privacy policy and terms of service for FightOS.</p>
  <ul>
    <li><a href="privacy.html">Gizlilik Politikası / Privacy Policy</a></li>
    <li><a href="terms.html">Kullanım Şartları / Terms of Service</a></li>
  </ul>
  <p>İletişim / Contact: <a href="mailto:ozanyyildirim33@gmail.com">ozanyyildirim33@gmail.com</a></p>
</div>
</body>
</html>
